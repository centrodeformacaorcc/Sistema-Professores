<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFO Class</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/7Q1KoaM.png">
    
    <!-- Proteção Anti-DevTools e Anti-Cópia -->
    <script src="./devtools.js"></script>

    <!-- Integração do Google Firebase / Firestore -->
   <script type="module" src="./firebase.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script crossorigin="anonymous" src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@300;400;500;600;700&family=Anton&family=JetBrains+Mono:wght@400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                        condensed: ['Oswald', 'sans-serif'],
                        display: ['Anton', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#2e5c18',
                            hover: '#224212',
                            light: '#4a7a30',
                            accent: '#fbbf24',
                        },
                        paper: '#fdfbf7',
                        dark: {
                            bg: '#0a0f0b',
                            surface: '#121a14',
                            element: '#1c261e',
                            hover: '#253026',
                        }
                    },
                    backgroundImage: {
                        'military-grid': "linear-gradient(rgba(46, 92, 24, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(46, 92, 24, 0.1) 1px, transparent 1px)",
                    },
                    boxShadow: {
                        'tactical': '0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15)',
                        'folder': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255,255,255,0.1)',
                    },
                    animation: {
                        'slide-in': 'slideIn 0.3s ease-out forwards',
                        'slide-out': 'slideOut 0.3s ease-in forwards',
                        'scan': 'scan 3s linear infinite',
                        'blink': 'blink 1s step-end infinite',
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        slideOut: {
                            '0%': { transform: 'translateX(0)', opacity: '1' },
                            '100%': { transform: 'translateX(100%)', opacity: '0' },
                        },
                        scan: {
                            '0%': { top: '0%' },
                            '100%': { top: '100%' }
                        },
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        }
                    }
                }
            }
        }
    </script>
<style>
           body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #f0f2f5;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transition: background-color 0.3s ease;
        }

        html.dark body {
            background-color: #0f1a11;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            color: #f1f5f9;
        }

        #root {
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        html.dark ::-webkit-scrollbar-track {
            background: #0f1a11;
        }

        ::-webkit-scrollbar-thumb {
            background: #a1a1aa;
            border-radius: 4px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        html.dark ::-webkit-scrollbar-thumb {
            background: #2e5c18;
            border-radius: 0px;
            border: 1px solid #0f1a11;
            background-clip: border-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #71717a;
        }

        html.dark ::-webkit-scrollbar-thumb:hover {
            background: #fbbf24;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .paper-container {
            background-color: #ffffff;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #2e5c18;
        }

        .dark .paper-container {
            background-color: #121a14;
            border: 1px solid #2e5c18;
            border-top: 4px solid #2e5c18;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.03;
            width: 60%;
            pointer-events: none;
            z-index: 0;
        }
        
        /* Custom scrollbar for inner areas */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
</style>
</head>

<body>
    <div id="root"></div>

<script type="text/babel" src="./script.js"></script>
</body>

</html>
